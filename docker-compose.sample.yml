# Services
services:

    # APP
    app:
        build:
            context: ./
            dockerfile: Dockerfile
        image: appetiser/project-dev:0
        container_name: app
        restart: unless-stopped
        tty: true
        depends_on:
            - mysql
            - redis
            - mailpit
            - minio
        ports:
            - 81:80
            - '${VITE_PORT:-5174}:${VITE_PORT:-5173}'
        environment:
            - XDEBUG_SESSION=${XDEBUG_SESSION:-0}
            - XDEBUG_CONFIG=${XDEBUG_CONFIG:-client_host=host.docker.internal}
        volumes:
            - ./:/var/www/html
            - ./.docker/nginx.conf:/etc/nginx/conf.d/default.conf
            - ./.docker/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf
            - ./.docker/fpm-pool.conf:/etc/php/8.3/fpm/pool.d/www.conf
            - ./.docker/php.ini:/etc/php/8.3/fpm/conf.d/99-php.ini
            - ./.docker/xdebug.ini:/etc/php/8.3/cli/conf.d/20-xdebug.ini
            - ./../auth.json:/home/laravel/.config/composer/auth.json
            - ~/.ssh:/home/laravel/.ssh
        networks:
            - default
        extra_hosts:
            - host.docker.internal:host-gateway
            - myproject.local:host-gateway #myproject.local:81

    # Database
    mysql:
        image: mysql/mysql-server:8.0
        container_name: mysql
        restart: unless-stopped
        ports:
            - ${DB_PORT:-3306}:3306
        environment:
            MYSQL_DATABASE: laravel
            MYSQL_USER: laravel
            MYSQL_PASSWORD: laravel
            MYSQL_ROOT_PASSWORD: laravel
        volumes:
            - mysql-data:/var/lib/mysql/
        networks:
            - default

    # Test Database
    mysql-test:
        image: mysql/mysql-server:8.0
        container_name: mysql-test
        restart: unless-stopped
        ports:
            - 3307:3306
        environment:
            MYSQL_DATABASE: "${DB_DATABASE:-laravel}_test"
            MYSQL_USER: laravel
            MYSQL_PASSWORD: laravel
            MYSQL_ROOT_PASSWORD: laravel
        volumes:
            - mysql-test-data:/var/lib/mysql/
        networks:
            - default

    # Redis
    redis:
        image: redis:alpine
        container_name: redis
        ports:
            - 6379:6379
        volumes:
            - redis-data:/data
        networks:
            - default

    # Mail
    mailpit:
        image: axllent/mailpit:latest
        container_name: mailhog
        restart: unless-stopped
        ports:
            - ${MAIL_PORT:-1025}:1025
            - ${MAIL_DASHBOARD_PORT:-8025}:8025
        networks:
            - default

    # Minio Server
    minio:
        image: minio/minio:latest
        container_name: minio
        command: minio server /data/minio --console-address ":8900"
        ports:
            - 9001:9000 # feel free to update the ports
            - 8901:8900
        environment:
            - MINIO_ROOT_USER=${AWS_ACCESS_KEY_ID:-laravel}
            - MINIO_ROOT_PASSWORD=${AWS_SECRET_ACCESS_KEY:-password}
        volumes:
            - minio-data:/data
        networks:
            - default

# Networks
networks:
    default:
        driver: bridge

# Volumes
volumes:
    mysql-data:
        driver: local
    mysql-test-data:
        driver: local
    minio-data:
        driver: local
    redis-data:
        driver: local
